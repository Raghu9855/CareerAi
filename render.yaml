services:
  - type: web
    name: careerai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./careerai_dev.db
      - key: STORAGE_BACKEND
        value: local
      - key: VECTOR_STORE_TYPE
        value: memory
      - key: LLM_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
