name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-aiofiles
          pip install -e .

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy app

  test:
    name: Automated Tests & Coverage
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: careerai_test_db
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Test Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -e .

      - name: Execute Pytest Suite with Coverage
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
          STORAGE_LOCAL_ROOT: ./test_storage
          LLM_PROVIDER: mock
          VECTOR_STORE_TYPE: memory
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  build-docker-image:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: careerai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
